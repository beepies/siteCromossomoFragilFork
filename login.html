<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login de Usuário</title>
    <link rel="stylesheet" href="styles/login.css">
    <script type="module" src="JS/login.js" defer></script>
</head>

<body>

    <div class="hex-bg"></div>
    <div class="hex-deco hex-deco-1"></div>
    <div class="hex-deco hex-deco-2"></div>
    <div class="hex-deco hex-deco-3"></div>
    <div class="hex-deco hex-deco-4"></div>

    <div class="login-card">

        <h2>Login de Usuário</h2>

        <form id="meuFormulario">

            <div class="inputGrupo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="inputGrupo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="botaoLogin">Enviar Dados</button>
        </form>

        <p class="register">Profissional de saúde, não tem conta? <a href="cadastro_medico.html">Cadastre-se!</a></p>
        <p class="register"><a href="index.html">Voltar para a página inicial</a></p>
    </div>

</body>

</html>
