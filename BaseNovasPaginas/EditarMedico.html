<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Profissional</title>
</head>

<body>

    <h2>Editar Profissional</h2>

    <form id="formEditarMedico">

        <label for="nome_completo">Nome completo:</label>
        <input type="text" id="nome_completo" placeholder="Nome completo do profissional" maxlength="150" required>
        <br>

        <label for="registro_profissional">Registro profissional:</label>
        <input type="text" id="registro_profissional" placeholder="Ex: CRM/PR 111111" maxlength="30" required>
        <br>

        <label for="especialidade">Especialidade:</label>
        <input type="text" id="especialidade" placeholder="Ex: Neurologia, Psiquiatria" maxlength="100" required>
        <br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="profissional@email.com" maxlength="100">
        <br>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" placeholder="Digite o telefone de contato" maxlength="20">
        <br>

        <label for="instituicao">Instituição:</label>
        <input type="text" id="instituicao" placeholder="Hospital ou clínica de atuação" maxlength="200">
        <br>

        <label for="senha_profissional">Nova senha:</label>
        <input type="password" id="senha_profissional" placeholder="Digite uma nova senha" maxlength="255">
        <br>

        <label for="confirmar_senha">Confirmar nova senha:</label>
        <input type="password" id="confirmar_senha" placeholder="Confirme a nova senha">
        <br>

        <button type="submit">Salvar Alterações</button>
        <button type="button">Cancelar</button>

    </form>

</body>

</html>
