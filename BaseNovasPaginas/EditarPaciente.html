<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Dados do Paciente</title>
</head>
<body>
    <h2>Editar Dados do Paciente</h2>
    <form id="formEditarPaciente">

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" placeholder="Nome completo do paciente" required>
        <br>

        <label for="data_nascimento">Data de nascimento:</label>
        <input type="date" id="data_nascimento" required>
        <br>

        <label for="contato">Número para contato:</label>
        <input type="tel" id="contato" placeholder="Número de contato">
        <br>
        <label for="responsavel_legal">Nome do responsável legal:</label>
        <input type="text" id="responsavel_legal" placeholder="Nome do responsável legal">
        <br>
        <label for="dias_ultimo_quiz">Dias desde a última aplicação do quiz:</label>
        <input type="number" id="dias_ultimo_quiz" placeholder="Ex: 30" min="0">
        <br>
        <label for="foto_url">Link da foto para análise de sintomas:</label>
        <input type="url" id="foto_url" placeholder="https://exemplo.com/foto-paciente.jpg">
        <br>
        <button type="submit">Salvar Alterações</button>
        <button type="button">Cancelar</button>
    </form>

</body>

</html>
