<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Responsável Legal</title>
</head>
<body>
    <h2>Cadastro de Responsável Legal</h2>
    <form id="formCadastroResponsavel">
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" placeholder="Digite o nome completo do responsável" required>
        <br>
        <label for="data_nascimento">Data de nascimento:</label>
        <input type="date" id="data_nascimento" required>
        <br>
        <label for="parentesco">Parentesco com o paciente:</label>
        <select id="parentesco" required>
            <option value="" disabled selected>Selecione o parentesco</option>
            <option value="pai">Pai</option>
            <option value="mae">Mãe</option>
            <option value="avo_paterno">Avô paterno</option>
            <option value="avo_materno">Avô materno</option>
            <option value="avo_paterna">Avó paterna</option>
            <option value="avo_materna">Avó materna</option>
            <option value="tio">Tio</option>
            <option value="tia">Tia</option>
            <option value="irmao">Irmão</option>
            <option value="irma">Irmã</option>
            <option value="tutor">Tutor(a) legal</option>
            <option value="outro">Outro</option>
        </select>
        <br>

        <label for="contato">Contato:</label>
        <input type="tel" id="contato" placeholder="Digite o número de contato" required>
        <br>

        <button type="submit">Cadastrar Responsável</button>

    </form>

</body>

</html>
