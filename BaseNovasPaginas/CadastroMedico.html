<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Médico</title>
</head>

<body>

    <h2>Cadastro de Médico</h2>

    <form id="formCadastroMedico">

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" placeholder="Digite o nome completo do médico" required>
        <br>

        <label for="crm">CRM:</label>
        <input type="text" id="crm" placeholder="Ex: CRM/PR 111111" required>
        <br>

        <label for="data_nascimento">Data de nascimento:</label>
        <input type="date" id="data_nascimento" required>
        <br>

        <label for="especialidade">Especialidade:</label>
        <input type="text" id="especialidade" placeholder="Ex: Neurologia, Psiquiatria" required>
        <br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="medico@email.com" required>
        <br>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" placeholder="Digite o telefone de contato" required>
        <br>

        <label for="instituicao">Instituição:</label>
        <input type="text" id="instituicao" placeholder="Hospital ou clínica de atuação" required>
        <br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="Digite uma senha" required>
        <br>

        <label for="confirmar_senha">Confirmar senha:</label>
        <input type="password" id="confirmar_senha" placeholder="Confirme a senha" required>
        <br>

        <button type="submit">Cadastrar Médico</button>

    </form>

</body>

</html>
