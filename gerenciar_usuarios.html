<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar usuários</title>
    <link rel="stylesheet" href="styles/listar_pacientes.css">
    <script type="module" src="JS/gerenciar_usuarios.js" defer></script>
</head>
<body>
    <div class="hex-bg"></div>
    <div class="hex-deco hex-deco-1"></div>
    <div class="hex-deco hex-deco-2"></div>
    <div class="hex-deco hex-deco-3"></div>
    <div class="hex-deco hex-deco-4"></div>
    <div class="lista-card">

        <div class="areaTitulo">
            <h2>Gerenciar Usuários</h2>
            <p>Gerencie os níveis de acesso dos profissionais cadastrados no sistema.</p>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Registro</th>
                    <th>Especialidade</th>
                    <th>E-mail</th>
                    <th>Nível</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabelaUsuarios">
            </tbody>
        </table>
        <div id="mensagemStatus"></div>
        <button type="button" class="botaoVoltar" onclick="window.location.href='quiz.html'">Voltar</button>
    </div>

</body>
</html>
