<!-- CSS importante para a impressão -->
<!DOCTYPE html>
<html lang="pt-BR">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de avaliação clínica </title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="JS/imprimir_avaliacao.js"></script>
    <style> 
        :root {
            --primaria: #10b981;
            --primaria-dark: #065f46;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #dde5ef;
            --bg: #f0f4f8;}

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Figtree', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 32px 16px; }

        h1, h2, h3, h4 { font-family: 'Syne', sans-serif; }
        .pagina {
            max-width: 760px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

    .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 24px;
            border-bottom: 2px solid var(--primaria);
            margin-bottom: 32px;  }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px; height: 48px;
            background: var(--primaria);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: grid;
            place-items: center;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Syne', sans-serif;
        }

        .logo-texto h1 {
            font-size: 1.5rem;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .logo-texto p {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .cabecalho-info {
            text-align: right;
            font-size: 0.82rem;
            color: var(--text-light);
        }

     .cabecalho-info strong {
            display: block;
            font-size: 0.9rem;
            color: var(--text);
            font-family: 'Syne', sans-serif;
        }


        .secao {
            margin-bottom: 28px;
        }

        .secao-titulo {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--primaria-dark);
            background: #ecfdf5;
            padding: 4px 12px;
            border-radius: 4px;
            border-left: 3px solid var(--primaria);
            margin-bottom: 14px;
            display: inline-block;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .info-item {
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .info-item label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 3px;
        }

        .info-item span {
            font-size: 0.92rem;
            color: var(--text);
            font-weight: 500;
        }

     .classificacao {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 28px;
        }

        .classificacao.suspeito {
            background: #fef2f2;
            border: 1.5px solid #fca5a5;
        }

        .classificacao.baixo {
            background: #ecfdf5;
            border: 1.5px solid var(--primaria);
        }

        .classificacao-badge {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1rem;
        }

        .classificacao.suspeito .classificacao-badge { color: #b91c1c; }
        .classificacao.baixo .classificacao-badge { color: var(--primaria-dark); }

        .classificacao-score {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .classificacao-score strong {
            color: var(--text);
        }

        /* tabela sintomas */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        thead tr {
            background: var(--primaria);
            color: white;
        }

        th {
            font-family: 'Syne', sans-serif;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 10px 14px;
            text-align: left;
        }

        td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);   }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:nth-child(even) { background: #fafcff; }

        .tag-presente {
            background: #dcfce7;
            color: #166534;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Syne', sans-serif;
        }

        .tag-ausente {
            background: #f1f5f9;
            color: var(--text-light);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Syne', sans-serif;
        }
        .rodape {
            margin-top: 36px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.78rem;
            color: var(--text-light);
        }

        .assinatura {
            text-align: center;
        }

        .assinatura-linha {
            width: 200px;
            border-top: 1px solid var(--text);
            margin-bottom: 6px;
        }

        /* botões (não aparecem na impressão) */
        .acoes {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-bottom: 24px;
        }

        .btn-imprimir {
            padding: 10px 24px;
            background: var(--primaria);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-imprimir:hover { background: var(--primaria-dark); }

        .btn-voltar {
            padding: 10px 24px;
            background: transparent;
            color: var(--text-light);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-family: 'Figtree', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .carregando {
            text-align: center;
            padding: 60px;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        @media print {
            body { background: white; padding: 0; }
            .pagina { box-shadow: none; border-radius: 0; padding: 32px; }
            .acoes { display: none; }
        }
    </style>
</head>
<body>

<div class="acoes">
    <button class="btn-voltar" onclick="window.close()">Voltar</button>
    <button class="btn-imprimir" onclick="window.print()">Imprimir</button>
</div>

<div class="pagina" id="conteudo">
    <div class="carregando">Carregando avaliação...</div></div>
</body>
</html>
