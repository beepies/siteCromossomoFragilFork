<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Responsável Legal</title>
    <link rel="stylesheet" href="styles/cadastro_paciente.css">
    <script type="module" src="JS/cadastro_responsavel.js" defer></script>
</head>

<body>

    <div class="hex-bg"></div>
    <div class="hex-deco hex-deco-1"></div>
    <div class="hex-deco hex-deco-2"></div>
    <div class="hex-deco hex-deco-3"></div>
    <div class="hex-deco hex-deco-4"></div>

    <div class="cadastro-card">

        <div class="areaTitulo">
            <h2>Cadastro de Responsável Legal</h2>
        </div>

        <form id="formCadastroResponsavel">

            <div class="inputGrupo">
                <label for="nome_completo">Nome completo:</label>
                <input type="text" id="nome_completo" placeholder="Nome do responsável" maxlength="150" required>
            </div>

            <div class="form-grid-2">
                <div class="inputGrupo">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" placeholder="Digite o telefone" maxlength="20">
                </div>
                <div class="inputGrupo">
                    <label for="parentesco">Parentesco:</label>
                    <input type="text" id="parentesco" placeholder="Ex: Mãe, Pai, Tutor" maxlength="50">
                </div>
            </div>

            <div class="inputGrupo">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="responsavel@email.com">
            </div>

            <div class="inputGrupo">
                <label for="cpf_titular">CPF do paciente:</label>
                <input type="text" id="cpf_titular" placeholder="000.000.000-00" maxlength="14" required>
            </div>

            <button type="submit" class="botaoCadastro">Cadastrar Responsável</button>
            <button type="button" class="botaoVoltar" onclick="window.location.href='quiz.html'">Voltar</button>

        </form>

    </div>

</body>

</html>
