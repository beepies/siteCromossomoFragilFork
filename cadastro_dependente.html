<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Dependente</title>
    <link rel="stylesheet" href="styles/cadastro_paciente.css">
    <script type="module" src="JS/cadastro_dependente.js" defer></script>
</head>

<body>

    <div class="hex-bg"></div>
    <div class="hex-deco hex-deco-1"></div>
    <div class="hex-deco hex-deco-2"></div>
    <div class="hex-deco hex-deco-3"></div>
    <div class="hex-deco hex-deco-4"></div>

    <div class="cadastro-card">

        <div class="areaTitulo">
            <h2>Cadastro de Dependente</h2>
        </div>

        <form id="formCadastroDependente">

            <div class="inputGrupo">
                <label for="numero_inscricao">Número de inscrição:</label>
                <input type="text" id="numero_inscricao" placeholder="Digite o número de inscrição" maxlength="30" required>
            </div>

            <div class="inputGrupo">
                <label for="nome_completo">Nome completo:</label>
                <input type="text" id="nome_completo" placeholder="Digite o nome completo do dependente" maxlength="150" required>
            </div>

            <div class="form-grid-2">
                <div class="inputGrupo">
                    <label for="data_nascimento">Data de nascimento:</label>
                    <input type="date" id="data_nascimento" required>
                </div>
                <div class="inputGrupo">
                    <label for="sexo">Sexo:</label>
                    <select id="sexo" required>
                        <option value="" disabled selected>Selecione o sexo</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                    </select>
                </div>
            </div>

            <div class="inputGrupo">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="dependente@email.com">
            </div>

            <div class="inputGrupo">
                <label for="cpf_titular">CPF do paciente titular:</label>
                <input type="text" id="cpf_titular" placeholder="000.000.000-00" maxlength="14" required>
            </div>

            <button type="submit" class="botaoCadastro">Cadastrar Dependente</button>
            <button type="button" class="botaoVoltar" onclick="window.location.href='quiz.html'">Voltar</button>

        </form>

    </div>

</body>

</html>
