<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Paciente</title>
    <script type="module" src="JS/editar_paciente.js" defer></script>
</head>

<body>

    <h2>Editar Paciente</h2>

    <form id="formEditarPaciente">

        <label for="numero_inscricao">Número de inscrição:</label>
        <input type="text" id="numero_inscricao" placeholder="Número de inscrição" maxlength="30" required>
        <br>
        
        <label for="nome_completo">Nome completo:</label>
        <input type="text" id="nome_completo" placeholder="Nome completo do paciente" maxlength="150" required>
        <br>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
        <br>

        <label for="data_nascimento">Data de nascimento:</label>
        <input type="date" id="data_nascimento" required>
        <br>

        <label for="sexo">Sexo:</label>
        <select id="sexo" required>
            <option value="" disabled selected>Selecione o sexo</option>
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
        </select>
        <br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="paciente@email.com" maxlength="100">
        <br>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" placeholder="Digite o número de contato" maxlength="20">
        <br>

        <label for="endereco">Endereço:</label>
        <textarea id="endereco" placeholder="Rua, número, bairro, cidade, estado, CEP"></textarea>
        <br>

        <label for="novo_registro_profissional_atual">Novo Registro Profissional Atual:</label>
        <input type="text" id="novo_registro_profissional_atual" placeholder="Ex: 123456-SP" maxlength="20" required>
        <br>

        <button type="submit">Salvar Alterações</button>
        <button type="button">Cancelar</button>

    </form>

</body>

</html>
