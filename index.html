<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <script type="module" src="JS/cadastro.js" defer></script>
</head>

<body>

    <h2>Criar Nova Conta</h2>

    <!-- O atributo 'action' define para onde os dados serão enviados -->
    <!-- O atributo 'method' define o método HTTP (POST é o ideal para cadastros) -->
    <form  id="meuFormulario">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>
        <br>
        <label for="Registro_profissional">Registro profissional:</label>
        <input type="text" id="Registro_profissional" placeholder="Digite seu registro profissional" required>
        <br>
        <label for="Especialidade">Especialidade:</label>
        <input type="text" id="Especialidade" placeholder="Digite sua especialidade" required>
        <br>
        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
        <br>
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" placeholder="Digite seu telefone" required>
        <br>
        <label for="Instituicao">Instituição:</label>
        <input type="text" id="Instituicao" placeholder="Digite sua instituição" required>
        <br>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
        <br>
        <button type="submit">Enviar Dados</button>
    </form>

</body>

</html>
